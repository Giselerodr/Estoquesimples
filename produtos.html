<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Produtos - Estoque Inteligente</title>
</head>

<body>

    <h1>Cadastro de Produtos</h1>

    <form id="formProduto">

        <label for="nome">Nome do produto:</label><br>
        <input type="text" id="nome" name="nome" required>

        <br><br>

        <label for="categoria">Categoria:</label><br>
        <input type="text" id="categoria" name="categoria" required>

        <br><br>

        <label for="codigo">Código:</label><br>
        <input type="text" id="codigo" name="codigo" required>

        <br><br>

        <label for="quantidade">Quantidade:</label><br>
        <input type="number" id="quantidade" name="quantidade" min="0" step="0.01" required>

        <br><br>

        <label for="estoqueMinimo">Estoque mínimo:</label><br>
        <input type="number" id="estoqueMinimo" name="estoqueMinimo" min="0" step="0.01" required>

        <br><br>

        <label for="validade">Data de validade:</label><br>
        <input type="date" id="validade" name="validade">

        <br><br>

        <button type="submit">Cadastrar produto</button>

    </form>


    <hr>


    <h2>Produtos cadastrados</h2>

    <div id="listaProdutos"></div>


    <script src="script.js"></script>

</body>

</html>
