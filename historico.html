
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico - Estoque Simples</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #F5F5DC;
            color: #211E1B;
        }

        header {
            background: #0C0A29;
            color: white;
            padding: 25px;
            text-align: center;
        }

        nav a {
            color: #BFDCFF;
            margin: 0 10px;
            text-decoration: none;
            display: inline-block;
            padding: 6px;
        }

        main {
            max-width: 1150px;
            margin: 30px auto;
            padding: 0 16px;
        }

        .card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 22px;
            box-shadow: 0 3px 12px #00000012;
        }

        .resumo {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .numero {
            font-size: 28px;
            font-weight: bold;
            color: #0C0A29;
        }

        .filtros {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input, select {
            width: 100%;
            padding: 11px;
            border: 1px solid #aaa;
            border-radius: 7px;
        }

        button {
            background: #0C0A29;
            color: white;
            border: none;
            border-radius: 7px;
            padding: 12px 18px;
            cursor: pointer;
            margin-top: 15px;
        }

        .tabela-container { overflow-x: auto; }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 650px;
        }

        th, td {
            text-align: left;
            padding: 13px;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #0C0A29;
            color: white;
        }

        .entrada {
            color: #176B36;
            font-weight: bold;
        }

        .saida {
            color: #B42318;
            font-weight: bold;
        }

        @media (max-width: 750px) {
            .filtros { grid-template-columns: 1fr 1fr; }
            .resumo { grid-template-columns: 1fr; }
        }

        @media (max-width: 450px) {
            .filtros { grid-template-columns: 1fr; }
        }
    </style>
</head>

<body>
    <header>
        <h1>Estoque Simples</h1>
        <p>Histórico de Movimentações</p>

        <nav>
            <a href="index.html">Início</a>
            <a href="produtos.html">Produtos</a>
            <a href="entrada.html">Entradas</a>
            <a href="saida.html">Saídas</a>
            <a href="historico.html">Histórico</a>
        </nav>
    </header>

    <main>
        <section class="resumo">
            <div class="card">
                <h3>Total de entradas</h3>
                <div class="numero" id="totalEntradas">0</div>
            </div>

            <div class="card">
                <h3>Total de saídas</h3>
                <div class="numero" id="totalSaidas">0</div>
            </div>

            <div class="card">
                <h3>Movimentações</h3>
                <div class="numero" id="totalMovimentacoes">0</div>
            </div>
        </section>

        <section class="card">
            <h2>Pesquisar movimentações</h2>

            <div class="filtros">
                <div>
                    <label for="pesquisa">Produto</label>
                    <input id="pesquisa" type="search"
                        placeholder="Nome ou código">
                </div>

                <div>
                    <label for="tipo">Tipo</label>
                    <select id="tipo">
                        <option value="todos">Todos</option>
                        <option value="Entrada">Entradas</option>
                        <option value="Saída">Saídas</option>
                    </select>
                </div>

                <div>
                    <label for="inicio">Data inicial</label>
                    <input id="inicio" type="date">
                </div>

                <div>
                    <label for="fim">Data final</label>
                    <input id="fim" type="date">
                </div>
            </div>

            <button id="exportar" type="button">
                Exportar CSV
            </button>
        </section>

        <section class="card">
            <h2>Registros encontrados</h2>
            <p id="quantidadeRegistros"></p>

            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Produto</th>
                            <th>Código</th>
                            <th>Tipo</th>
                            <th>Quantidade</th>
                        </tr>
                    </thead>
                    <tbody id="listaHistorico"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="historico.js"></script>
</body>
</html>
