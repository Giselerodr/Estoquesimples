<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Saída de Mercadorias</title>
</head>

<body>

    <h1>Saída de Mercadorias</h1>

    <form id="formSaida">

        <label>Produto:</label><br>

        <select id="produto">
            <option value="">Selecione um produto</option>
        </select>

        <br><br>

        <label>Quantidade de saída:</label><br>

        <input type="number" id="quantidade" min="1">

        <br><br>

        <label>Data da saída:</label><br>

        <input type="date" id="data">

        <br><br>

        <button type="submit">
            Registrar saída
        </button>

    </form>


    <h2>Saídas realizadas</h2>

    <table border="1">

        <thead>

            <tr>
                <th>Produto</th>
                <th>Quantidade</th>
                <th>Data</th>
            </tr>

        </thead>

        <tbody id="listaSaidas">
        </tbody>

    </table>


    <script src="saida.js"></script>

</body>

</html>
